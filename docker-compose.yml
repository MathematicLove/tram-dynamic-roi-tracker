services:
  tram-dynamic-roi-tracker:
    image: ${DOCKERHUB_IMAGE:-tram-dynamic-roi-tracker:latest}
    build:
      context: .
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/app/models
      - ./results:/app/results
      - ./videos:/app/videos:ro
    # devices:
    #   - /dev/video0:/dev/video0   # uncomment on Linux hosts to pass the camera through for Camera Mode
    command: ["python", "ui/app.py"]
    network_mode: host
